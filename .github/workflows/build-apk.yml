name: Build DataCore ERP Trial V1 (Unverified)
on:
  push:
    branches: [feature/trial-v1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Extract and patch native Google Sign-In
        run: |
          rm -rf app && mkdir app
          unzip -o DataCore-ERP-Trial-V1-Ready-for-GitHub.zip -d app
          if [ -d app/datacore_work ]; then shopt -s dotglob; mv app/datacore_work/* app/; rmdir app/datacore_work; fi
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path("app/src/components/LoginScreen.tsx")
          s=p.read_text()
          cfg=json.loads(Path("app/firebase-applet-config.json").read_text())
          client_id=cfg["oAuthClientId"]
          s=s.replace("  signInWithPopup,\n", "  signInWithCredential,\n")
          s=s.replace("import { ShieldCheck", "import { GoogleSignIn } from '@capawesome/capacitor-google-sign-in';\nimport { ShieldCheck")
          old="      const provider = new GoogleAuthProvider();\n      await signInWithPopup(auth, provider);"
          new=f"      await GoogleSignIn.initialize({{ clientId: '{client_id}' }});\n      const result = await GoogleSignIn.signIn();\n      const credential = GoogleAuthProvider.credential(result.idToken);\n      await signInWithCredential(auth, credential);"
          if old not in s: raise SystemExit("Google login block not found")
          p.write_text(s.replace(old,new))
          login=p.read_text()
          if 'UserPlus' in login and 'UserPlus,' not in login.split("from 'lucide-react'")[0]:
              login=login.replace('import { ShieldCheck,', 'import { UserPlus, ShieldCheck,')
              p.write_text(login)
          PY
      - name: Include business module registry
        run: |
          mkdir -p app/src/business
          cp trial-modules/businessModules.ts app/src/business/businessModules.ts
          cp trial-modules/employeeAttendance.ts app/src/business/employeeAttendance.ts
          cp trial-modules/businessAccess.ts app/src/business/businessAccess.ts
          cp trial-modules/BusinessDashboard.tsx app/src/business/BusinessDashboard.tsx
          cp trial-modules/TrialBusinessRouter.tsx app/src/business/TrialBusinessRouter.tsx
          cp trial-modules/billing.ts app/src/business/billing.ts
          cp trial-modules/BillingScreen.tsx app/src/business/BillingScreen.tsx
          test -s app/src/business/businessModules.ts
      - name: Wire trial customer business dashboard into actual App
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/App.tsx')
          s=p.read_text()
          anchor="import { TrialManager } from './components/TrialManager';"
          assert anchor in s, 'Missing App import anchor'
          s=s.replace(anchor,anchor+"\nimport { BusinessDashboard } from './business/BusinessDashboard';\nimport type { BusinessType } from './business/businessModules';",1)
          anchor="  const [trialExpiry, setTrialExpiry] = useState<number>(0);"
          assert anchor in s, 'Missing expiry state'
          s=s.replace(anchor,anchor+"\n  const [trialBusinessType, setTrialBusinessType] = useState<BusinessType | null>(null);",1)
          anchor="      setTrialExpiry(expiry);"
          assert anchor in s, 'Missing trial snapshot expiry'
          s=s.replace(anchor,"      const kind = data?.businessType;\n      setTrialBusinessType(kind === 'restaurant' || kind === 'laundry' || kind === 'grocery' || kind === 'workshop' ? kind : null);\n"+anchor,1)
          anchor="    if (!currentUser || isOwner()) return;"
          assert anchor in s, 'Missing customer trial listener'
          s=s.replace(anchor,"    if (!currentUser || isOwner()) { setTrialBusinessType(null); return; }",1)
          anchor="  // Navigation Items"
          assert anchor in s, 'Missing navigation anchor'
          insertion="  if (!isOwner()) {\n    if (!trialBusinessType) return <div className=\"min-h-screen bg-slate-950 text-white p-8\">Invalid business type. Contact DataCore ERP administrator.<button className=\"block mt-4 bg-cyan-700 p-3 rounded\" onClick={handleLogout}>Sign Out</button></div>;\n    return <div className=\"min-h-screen bg-slate-950 text-white\">\n      <header className=\"p-4 bg-slate-900 flex justify-between items-center\"><strong>DataCore ERP — {trialBusinessType}</strong><button onClick={handleLogout} className=\"bg-slate-700 rounded px-3 py-2\">Sign Out</button></header>\n      <BusinessDashboard account={{uid: currentUser.uid, businessType: trialBusinessType, status: 'active', expiresAtMillis: trialExpiry}} activePage={activeModule} onNavigate={setActiveModule} />\n    </div>;\n  }\n\n"
          s=s.replace(anchor,insertion+anchor,1)
          p.write_text(s)
          print('Integrated business type from trialAccounts into customer dashboard routing')
          PY
      - name: Inspect Firestore initialization safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          dbid=json.loads(Path('firebase.json').read_text())['firestore'][0]['database']
          print('Expected named database:',dbid)
          files=[p for p in Path('app').rglob('*') if p.suffix in ('.ts','.tsx','.js','.jsx') and 'node_modules' not in p.parts]
          found=[]
          for p in files:
              src=p.read_text(errors='replace')
              for m in re.finditer(r'(getFirestore|initializeFirestore|firebaseConfig|databaseId|firestoreDatabaseId)',src):
                  excerpt=src[max(0,m.start()-100):m.end()+160].replace('\\n',' ')
                  found.append((str(p),excerpt))
          for name,excerpt in found[:35]:
              print(name,':',excerpt[:260])
          print('Firestore references found:',len(found))
          if not found: print('WARNING: No Firestore initialization found; investigate source layout')
          print('Diagnostic only: no APK database patch attempted.')
          PY
      - name: Validate trial source isolation before build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('app/src')
          required=['App.tsx','tenant.ts','components/TrialManager.tsx']
          for file in required:
              if not (root/file).exists(): raise SystemExit('Missing trial file: '+file)
          tenant=(root/'tenant.ts').read_text()
          if "['tenants', user.uid, name]" not in tenant: raise SystemExit('Tenant isolation helper missing')
          app=(root/'App.tsx').read_text()
          if "trialAccounts" not in app or "trialStatus !== 'active'" not in app: raise SystemExit('Trial access gate missing')
          for p in root.rglob('*.tsx'):
              if p.name in ('TrialManager.tsx','App.tsx'): continue
    if p.as_posix() == 'app/src/business/BillingScreen.tsx' and "collection(db, 'tenants', tenantId, 'invoices')" in p.read_text(): continue
              content=p.read_text()
              if 'collection(db,' in content or 'doc(db,' in content:
                  raise SystemExit('Direct Firestore access needs review: '+str(p))
          print('Trial isolation static preflight passed')
          PY
      - name: Install and build web app
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npm install @capacitor/core@8 @capacitor/android@8 @capawesome/capacitor-google-sign-in --no-audit --no-fund
          npm install -D @capacitor/cli@8 --no-audit --no-fund
          npm run lint
          npm run build
          printf '%s\n' '{"appId":"com.datacore.erp","appName":"DataCore ERP","webDir":"dist"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done
      - name: Sign release APK with permanent key
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release-signing.jks
          chmod 600 app/release-signing.jks
          cat >> gradle.properties <<'EOF'
          android.useAndroidX=true
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle")
          s=p.read_text()
          marker="android {"
          if marker not in s: raise SystemExit("Android Gradle block not found")
          injection="""android {
              signingConfigs {
                  release {
                      storeFile file('release-signing.jks')
                      storePassword System.getenv('STORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
          """
          s=s.replace(marker,injection,1)
          release="buildTypes {"
          if release not in s: raise SystemExit("buildTypes block not found")
          import re
          s, count = re.subn(r"(buildTypes\s*\{\s*release\s*\{)", lambda m: m.group(1) + "\n            signingConfig signingConfigs.release", s, count=1)
          if count != 1: raise SystemExit("Release build type not found")
          p.write_text(s)
          PY
          chmod +x gradlew
          ./gradlew assembleRelease
          keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk | grep 'SHA1:' || true
          rm -f app/release-signing.jks
      - uses: actions/upload-artifact@v4
        with:
          name: DataCore-ERP-Trial-V1-UNVERIFIED
          path: app/android/app/build/outputs/apk/release/app-release.apk
