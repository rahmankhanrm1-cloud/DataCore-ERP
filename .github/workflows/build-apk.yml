name: Build DataCore ERP APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Extract and patch native Google Sign-In
        run: |
          rm -rf app && mkdir app
          unzip -o datacore-erp-final.zip -d app
          if [ -d app/datacore_work ]; then shopt -s dotglob; mv app/datacore_work/* app/; rmdir app/datacore_work; fi
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path("app/src/components/LoginScreen.tsx")
          s=p.read_text()
          cfg=json.loads(Path("app/firebase-applet-config.json").read_text())
          client_id=cfg["oAuthClientId"]
          s=s.replace("  signInWithPopup,\n", "  signInWithCredential,\n")
          s=s.replace("import { ShieldCheck", "import { GoogleSignIn } from '@capawesome/capacitor-google-sign-in';\nimport { ShieldCheck")
          old="      const provider = new GoogleAuthProvider();\n      await signInWithPopup(auth, provider);"
          new=f"      await GoogleSignIn.initialize({{ clientId: '{client_id}' }});\n      const result = await GoogleSignIn.signIn();\n      const credential = GoogleAuthProvider.credential(result.idToken);\n      await signInWithCredential(auth, credential);"
          if old not in s: raise SystemExit("Google login block not found")
          p.write_text(s.replace(old,new))
          PY
      - name: Install and build web app
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npm install @capacitor/core@8 @capacitor/android@8 @capawesome/capacitor-google-sign-in --no-audit --no-fund
          npm install -D @capacitor/cli@8 --no-audit --no-fund
          npm run build
          printf '%s\n' '{"appId":"com.datacore.erp","appName":"DataCore ERP","webDir":"dist"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done
      - name: Sign release APK with permanent key
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release-signing.jks
          chmod 600 app/release-signing.jks
          cat >> gradle.properties <<'EOF'
          android.useAndroidX=true
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle")
          s=p.read_text()
          marker="android {"
          if marker not in s: raise SystemExit("Android Gradle block not found")
          injection="""android {
              signingConfigs {
                  release {
                      storeFile file('release-signing.jks')
                      storePassword System.getenv('STORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
          """
          s=s.replace(marker,injection,1)
          release="buildTypes {"
          if release not in s: raise SystemExit("buildTypes block not found")
          s=s.replace("release {", "release {\n            signingConfig signingConfigs.release", 1)
          p.write_text(s)
          PY
          chmod +x gradlew
          ./gradlew assembleRelease
          keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk | grep 'SHA1:' || true
          rm -f app/release-signing.jks
      - uses: actions/upload-artifact@v4
        with:
          name: DataCore-ERP-Signed-Release-APK
          path: app/android/app/build/outputs/apk/release/app-release.apk
