name: Build DataCore ERP APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Reconstruct final source
        run: |
          cat source-parts/part-* | base64 -d > datacore-erp-final.zip
          unzip -o datacore-erp-final.zip -d app
      - name: Install and build web app
        working-directory: app
        run: |
          npm install
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          npm run build
          npx cap add android
          npx cap sync android
      - name: Build Android APK
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DataCore-ERP-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
