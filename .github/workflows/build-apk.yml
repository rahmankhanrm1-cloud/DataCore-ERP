name: Build DataCore ERP APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Extract source
        run: |
          rm -rf app
          mkdir app
          unzip -o datacore-erp-final.zip -d app
          if [ -d app/datacore_work ]; then
            shopt -s dotglob
            mv app/datacore_work/* app/
            rmdir app/datacore_work
          fi
      - name: Install and build web app
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npm install @capacitor/core@7 @capacitor/android@7 --no-audit --no-fund
          npm install -D @capacitor/cli@7 --no-audit --no-fund
          npm run build
          printf '%s\n' '{"appId":"com.datacore.erp","appName":"DataCore ERP","webDir":"dist"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Build Android APK
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DataCore-ERP-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
