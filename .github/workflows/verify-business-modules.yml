name: Verify Trial Business Modules
on:
  workflow_dispatch:
  push:
    branches: [feature/trial-v1]
    paths:
      - trial-modules/**
      - .github/workflows/verify-business-modules.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Type-check module sources and test billing
        run: |
          mkdir -p /tmp/datacore-tests
          cd /tmp/datacore-tests
          npm init -y >/dev/null
          npm install --no-audit --no-fund typescript@5 tsx@4 @types/react@19 react@19 firebase@12 >/dev/null
          mkdir -p business
          cp "$GITHUB_WORKSPACE"/trial-modules/*.ts "$GITHUB_WORKSPACE"/trial-modules/*.tsx business/
          printf "export const db: any = {};\\nexport const auth: any = {currentUser:null};\\n" > firebase.ts
          cp business/*.ts business/*.tsx .
          cat > tenant.ts <<'STUB'
          import { collection } from 'firebase/firestore';
          import { db } from './firebase';
          export const erpCollection = (name: string) => collection(db, 'tenants', 'test-tenant', name);
          STUB
          sed -i "s|from '../tenant'|from './tenant'|" BillingScreen.tsx AttendanceScreen.tsx PayrollScreen.tsx EmployeesScreen.tsx CatalogScreen.tsx CustomersScreen.tsx WorkOrdersScreen.tsx
          sed -i "s|from '../firebase'|from './firebase'|" BillingScreen.tsx AttendanceScreen.tsx PayrollScreen.tsx EmployeesScreen.tsx CatalogScreen.tsx CustomersScreen.tsx WorkOrdersScreen.tsx
          ./node_modules/.bin/tsc --noEmit --skipLibCheck --jsx react-jsx --esModuleInterop --target ES2022 --moduleResolution node --module commonjs *.ts *.tsx
          cat > test.ts <<'TS'
          import { calculateInvoice, businessInvoiceReference } from './billing';
          import { BUSINESS_MODULES } from './businessModules';
          import { getCustomerNavigation, getCustomerCollectionPath } from './businessAccess';
          import { calculateNetPay } from './employeeAttendance';
          import { strict as assert } from 'node:assert';
          for (const type of ['restaurant','laundry','grocery','workshop'] as const) {
            const module = BUSINESS_MODULES[type];
            assert(module.collections.includes('attendance'));
            assert(module.navigation.includes('Billing') || module.navigation.includes('Invoices'));
            const active = {uid:'user123',businessType:type,status:'active' as const,expiresAtMillis:200000};
            assert(getCustomerNavigation(active,100000).length>0);
            assert.equal(getCustomerNavigation(active,200000).length,0);
            assert.deepEqual(getCustomerCollectionPath(active,'attendance',100000),['tenants','user123','attendance']);
            assert.throws(()=>getCustomerCollectionPath(active,'secret',100000));
            assert(businessInvoiceReference(type,1).endsWith('000001'));
            for(const currency of ['KWD','INR','USD'] as const) {
              const invoice={id:'1',tenantId:'user123',businessType:type,invoiceNumber:'T-1',createdAt:'2026-10-08',currency,status:'draft' as const,
                lines:[{id:'1',description:'Service',quantity:2,unitPrice:1.125,discountAmount:0.125,taxRatePercent:0}],payments:[]};
              const result=calculateInvoice(invoice);
              assert(result.total>0);
              assert.equal(result.balance,result.total);
            }
          }
          assert.equal(calculateNetPay({basePay:100,overtimePay:10,allowances:5,deductions:2}),113);
          console.log('PASS: all four businesses, attendance, trial expiry, tenant paths, billing currencies, payroll');
          TS
          ./node_modules/.bin/tsx test.ts
